version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: startup-planner-db
    environment:
      POSTGRES_USER: planner_user
      POSTGRES_PASSWORD: planner_pass_dev
      POSTGRES_DB: startup_planner
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: startup-planner-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: startup-planner-api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://planner_user:planner_pass_dev@postgres:5432/startup_planner
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_change_in_production
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  recommendation-engine:
    build:
      context: ./recommendation-engine
      dockerfile: Dockerfile
    container_name: startup-planner-engine
    environment:
      NODE_ENV: development
      PORT: 5001
    ports:
      - "5001:5001"
    volumes:
      - ./recommendation-engine:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: startup-planner-web
    environment:
      REACT_APP_API_URL: http://localhost:5000
      REACT_APP_ENGINE_URL: http://localhost:5001
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - recommendation-engine
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
